services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      # Makes host.docker.internal resolve to the host machine on Linux
      - "host.docker.internal:host-gateway"
    environment:
      - EXECUTIONS_TIMEOUT=120
      - EXECUTIONS_TIMEOUT_MAX=300

volumes:
  n8n_data:
    external: true   # use the existing volume from the original docker run
